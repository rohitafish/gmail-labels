version: 2
updates:
  # Python dependencies: requirements*.in (direct pins) and the uv-generated
  # lockfiles compiled from them (requirements*.txt, with hashes -- see
  # CONTRIBUTING.md's "Dependencies" for the `uv pip compile --universal`
  # command). If a Dependabot PR ever lands with bare pins and no hashes,
  # regenerate by hand before merging rather than trust it blindly.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The GitHub Actions used by the CI workflow.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
