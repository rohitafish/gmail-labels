name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly as well, so a newly published advisory against a pinned
  # dependency turns the badge red on its own (the pip-audit step below)
  # instead of waiting for the next push to notice it.
  schedule:
    - cron: '41 6 * * 1'
  # Also on demand: for the `secrets` job below this is the difference
  # between scanning a push range and scanning the whole repository.
  workflow_dispatch:

# Explicit, minimal token permissions: this workflow only reads the repo and
# runs tests/lint/the PII scan -- it never needs to write anything.
# pull-requests: read is NOT surplus to that. On a pull_request event the
# gitleaks action in the `secrets` job below lists the PR's commits to work out
# which range to scan; with contents: read alone that call returns 403
# "Resource not accessible by integration" and the job fails before scanning
# anything at all. Push events never take that path, which is why this went
# unnoticed -- the workflow has only ever been green on pushes.
permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # No single "production" Python version to float a floor on here (this
      # is a local CLI toolkit, not a deployed service) -- matrix the dev
      # machine's version (3.14) against the next LTS-ish floor (3.12) so
      # version drift shows up here instead of surprising someone on a
      # different machine. .coveragerc's fail_under headroom exists partly
      # for the branch-counting drift this can introduce between the two.
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # check-pii.sh scans commit history, so fetch it all rather than the
          # default shallow clone.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # --require-hashes: requirements*.txt are uv-generated (--universal)
        # lockfiles with a sha256 for every wheel across every platform, so
        # this installs exactly the bytes that were tested -- a substituted release fails here rather than running. pip
        # itself is pinned first because it isn't in the lock (pip can't
        # hash-verify its own upgrade) and the runner's copy has had its own
        # advisories.
        run: |
          pip install pip==26.2.1
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Dependency vulnerability audit (pip-audit)
        # Audits the lockfiles themselves against PyPI's advisory database
        # (OSV/PyPA). --no-deps because the files are fully pinned and hashed,
        # so there's nothing to resolve; --strict fails on any finding. pipx
        # keeps pip-audit's own dependencies out of the environment being
        # audited. Runs on both matrix legs; cheap, and the result is the same.
        run: >
          pipx run --spec pip-audit==2.10.1 pip-audit
          --strict --desc on --require-hashes --no-deps
          -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        # Run under coverage rather than as a bare `pytest -q`: same tests,
        # same pass/fail, but it also collects the data the next step checks.
        # Kept as two steps so a red X is unambiguous -- this one failing
        # means a test broke, the next one failing means coverage dropped.
        run: coverage run -m pytest -q

      - name: Coverage (threshold in .coveragerc)
        run: coverage report

      - name: PII / secret scan
        # .pii-denylist is gitignored and dev-machine-only, so it's absent
        # here: check-pii.sh WARNs about that and still runs the portable
        # structural checks (exit non-zero only on a real FAIL). Only needs
        # to run once -- it doesn't depend on the Python version -- but
        # matrix jobs don't share that state, so it runs on every leg; that's
        # cheap and harmless, not worth a separate job for.
        run: bash scripts/check-pii.sh --full

  # Credential-shape scan with gitleaks (config in .gitleaks.toml).
  # Complements check-pii.sh, which is the layer that knows this mailbox's
  # real identifiers (the bank, client and family names in label paths) -- a
  # generic secrets scanner cannot tell a real surname from an invented one,
  # so those live in the gitignored .pii-denylist and never reach CI. This
  # job is the backstop for what the pre-commit/pre-push hooks would have
  # caught on a machine where the hook was not installed.
  #
  # HOW MUCH it scans depends on the event, which is the action's own
  # behaviour and worth stating because it isn't obvious: on a push or PR it
  # scans only that range (verified in the run log -- `gitleaks detect
  # --log-opts=...<base>..<head>`), and only on schedule/workflow_dispatch,
  # where there is no range to infer, does it scan the whole repository.
  # That's the division of labour here: the hooks and this job cover what is
  # moving, the weekly schedule above and the monthly TruffleHog sweep cover
  # everything that has ever been committed.
  #
  # Its own job, not a step in `test` above: it doesn't depend on Python at
  # all, so running it on both matrix legs would be pure duplication.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # the full-history events need the full history
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
