# Monthly verified-credential sweep of the full history with TruffleHog.
# gitleaks (ci.yml, and the hooks) matches credential SHAPES; TruffleHog
# additionally VERIFIES candidates against the issuing provider, so a
# finding here means a live, working credential is in the public history --
# rotate it first, ask questions after. For this repo that means a Google
# OAuth client secret or a refresh token: revoke the client in the Google
# Cloud console, or the grant at myaccount.google.com/permissions.
# --only-verified keeps it silent otherwise. Runs on the 1st at 06:50 UTC
# (ten minutes after the sibling project's, so two scheduled sweeps don't
# contend for the same runner minute) and on demand.
name: Secrets (monthly, verified)

on:
  schedule:
    - cron: '50 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c  # v3.97.4
        with:
          path: ./
          extra_args: --only-verified
