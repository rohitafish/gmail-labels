# Per-repo configuration for scripts/check-pii.sh, which is a SHARED ENGINE:
# that file is byte-identical in gmail_labels and assetmgt, and everything
# that differs between them is here. Tracked, because none of it is secret --
# it is locations and policy, never values.

# Where a human reads about this check.
PII_DOC_HINT="SETUP-LOCAL.md's \"PII and secret checks\" section"

# Paths that must never be tracked. .gitignore is the only thing keeping the
# OAuth client secret and the two token files out of git, and `git add -f`
# silently defeats it. .pii-denylist is here too: it is the one sanctioned
# plaintext copy of this mailbox's real values, so committing it would publish
# the entire list at once. Bare names at any depth; nothing legitimately
# tracked has these names (docs/credentials.example.json is deliberately not
# matched).
PII_SECRET_FILE_RE='(^|/)(credentials\.json|client_secret[^/]*\.json|token_[^/]*\.json|\.pii-denylist)$'

# UK personal identifiers (NI numbers, postcodes, sort codes, mobiles): ON.
# This repo's subject matter is a personal mailbox -- label paths and the
# fixtures around them are exactly where a real postcode or phone number would
# turn up. The sort-code and mobile rules are WARNs because those shapes
# collide with dates and other digit runs.
PII_UK_RULES=1

# WARN when a commit adds a file git cannot grep inside. ON: this repo already
# gitignores a real .xlsx of label data for precisely this reason, so the next
# one someone adds should say so out loud.
PII_OFFICE_FILE_WARN=1

# The sibling repo sharing this engine -- tests/test_check_pii_shared.py uses
# it to catch the two copies drifting apart. Relative to this repo's root.
PII_SIBLING="../assetmgt"

# No confirmed-non-IP entries yet. The two public addresses in the test
# fixtures (Google Public DNS, and an RFC 5737 documentation address) warn on
# purpose: the WARN path itself is under test, and neither can be a home IP.
PII_IP_ALLOWLIST=''
