# Pins lint rules explicitly. Without this file, `ruff check` falls back to
# ruff's own built-in defaults, which is a much broader set than the old
# E4/E7/E9/F. An unpinned default is ambient machine state, not something
# committed to the repo -- it would silently change again on the next ruff
# upgrade unless it's pinned here.
target-version = "py312"  # floor across dev machines; CI matrixes 3.12/3.14

[lint]
# T20 (flake8-print) is deliberately NOT selected -- the inverse of the
# reasoning that would normally add it. This toolkit's whole user interface
# is print() (audit.py's summary, apply_moves.py's dry-run/apply narration);
# there is no logging framework and no typer.echo layer to push output
# through instead. Banning print() here would ban the product's output.
select = ["E4", "E7", "E9", "F", "I", "UP", "C4", "SIM", "FURB", "RUF"]
ignore = [
  # This codebase uses %-formatting consistently for every printed and
  # logged string (audit.py, apply_moves.py throughout) -- UP031 would want
  # each converted to an f-string or .format(). That's pure churn with no
  # behaviour change, and % is the house style here.
  "UP031",
]
